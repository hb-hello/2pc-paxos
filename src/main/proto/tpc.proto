syntax="proto3";

package org.example;

import "google/protobuf/empty.proto";
import "client.proto";

option java_package = "org.example";
option java_multiple_files = true;

service TPCService {
  rpc TPCPrepare (TPCPrepareMessage) returns (TPCAckMessage) {};
  rpc TPCPrepared (TPCPreparedMessage) returns (google.protobuf.Empty) {};
  rpc TPCCommit (TPCCommitMessage) returns (TPCAckMessage) {};
  rpc TPCAbort (TPCAbortMessage) returns (TPCAckMessage) {};
  rpc LeaderElected (NewLeader) returns (google.protobuf.Empty) {};

  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty) {};
}

message TPCPrepareMessage {
  ClientRequest client_request = 1;
  int32 sender_id = 2;
}

message TPCPreparedMessage {
  string request_id = 1;
  int32 sender_id = 2;
}

message TPCCommitMessage {
  string request_id = 1;
  int32 sender_id = 2;
}

message TPCAbortMessage {
  string request_id = 1;
  int32 sender_id = 2;
}

message TPCAckMessage {
}

message NewLeader {
  int32 sender_id = 1;
}