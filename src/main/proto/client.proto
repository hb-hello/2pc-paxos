syntax = "proto3";

package org.example;

option java_package = "org.example";
option java_multiple_files = true;

// Service definition
service ClientService {
  rpc Request(ClientRequest) returns (ClientReply);
}

// Core operation definitions
message Transfer {
  string sender = 1;
  string receiver = 2;
  double amount = 3;
}

message BalanceRequest {
  string account_id = 1;
}

message Operation {
  oneof op {
    Transfer transfer = 1;
    BalanceRequest balance_request = 2;
  }
}

message OperationResult {
  oneof result {
    bool success = 1;
    double balance = 2;
  }
}

// Client-Server communication
message ClientRequest {
  int64 timestamp = 1;
  Operation operation = 2;
  string client_id = 3;
}

message ClientReply {
  string sender_id = 1;
  int64 timestamp = 2;
  string client_id = 3;
  OperationResult result = 4;

}
